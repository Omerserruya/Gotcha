<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viewer probe</title>
<style>
  /* The photo viewer rules of prod frontend-v2-f4fbd448 (Inbox.module.css),
     with the tokens they use. A tall photo first (the worst case for the X),
     a wide one after 12 seconds. */
  :root { --space-8: 8px; --space-12: 12px; --space-16: 16px; --mobile-ink: #16150f;
          --mobile-ink-text: #fff; --radius-round: 999px; }
  html, body { margin: 0; } body { font: 14px -apple-system, sans-serif; background: #f4efe6; }
  .photoViewer { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column;
    background-color: color-mix(in srgb, var(--mobile-ink) 96%, transparent); }
  .photoViewerBar { flex: none; display: flex; justify-content: flex-end; align-items: center;
    padding-block: calc(max(env(safe-area-inset-top, 0px), 28px) + var(--space-8)) var(--space-8);
    padding-inline: var(--space-12); }
  .photoViewerStage { flex: 1; min-block-size: 0; display: flex; align-items: center; justify-content: center;
    padding-block: 0 calc(env(safe-area-inset-bottom, 0px) + var(--space-16)); padding-inline: var(--space-16); }
  .photoViewerImage { max-inline-size: 100%; max-block-size: 100%; object-fit: contain; }
  .photoViewerClose { display: inline-flex; align-items: center; justify-content: center;
    inline-size: 48px; block-size: 48px; padding: 0; border: 0; border-radius: var(--radius-round);
    background-color: color-mix(in srgb, var(--mobile-ink) 70%, transparent);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--mobile-ink-text) 24%, transparent),
      0 2px 8px color-mix(in srgb, var(--mobile-ink) 40%, transparent);
    color: var(--mobile-ink-text); font-size: 22px; }
  #out { position: fixed; z-index: 2000; inset-inline: 8px; bottom: 4px; font: 11px ui-monospace, monospace;
    color: #fff; background: rgba(0,0,0,.55); padding: 4px 6px; border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<p style="padding:80px 16px">the thread under the viewer</p>
<div class="photoViewer">
  <div class="photoViewerBar"><button class="photoViewerClose" id="x" aria-label="close">✕</button></div>
  <div class="photoViewerStage"><img class="photoViewerImage" id="img" alt=""></div>
</div>
<div id="out">…</div>
<script>
  function photo(w, h) {
    // A white photo with a red frame: the frame shows where the photo ends.
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#e00'; g.lineWidth = Math.round(w / 40); g.strokeRect(0, 0, w, h);
    g.fillStyle = '#333'; g.font = (w / 12) + 'px sans-serif'; g.fillText(w + 'x' + h, w / 10, h / 2);
    return c.toDataURL('image/png');
  }
  var img = document.getElementById('img'), x = document.getElementById('x');
  function measure(label) {
    var a = x.getBoundingClientRect(), b = img.getBoundingClientRect();
    var overlap = !(a.bottom <= b.top || a.top >= b.bottom || a.right <= b.left || a.left >= b.right);
    var t = label + ' X=' + [a.top, a.bottom].map(Math.round).join('-') +
      ' img=' + [b.top, b.bottom, b.left, b.right].map(Math.round).join(',') +
      ' innerH=' + innerHeight + ' overlap=' + overlap + ' inside=' + (b.bottom <= innerHeight && b.top >= 0);
    document.getElementById('out').textContent = t; console.log(t);
  }
  img.onload = function () { setTimeout(function () { measure(img.naturalWidth > img.naturalHeight ? 'WIDE' : 'TALL'); }, 300); };
  img.src = photo(1080, 2400);
  setTimeout(function () { img.src = photo(2400, 1080); }, 12000);
</script>
</body>
</html>
