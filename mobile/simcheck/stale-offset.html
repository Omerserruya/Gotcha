<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* The /m frame (MobileShell .frame + a screen's 58px MobileBar), for the
     "customer info opens without its bar" check (Omer, 2026-11-15).
     Act 1, the thread: a composer at the bottom is focused, the keyboard
     comes up and pushes the web view. Act 2, customer info: the composer
     leaves the page with focus in it (as navigating away does) and the
     screen is replaced. The bar must end at the top: scrollY=0, barTop=0. */
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #f7f4ee; font-family: -apple-system, sans-serif; }
  .frame { display: flex; flex-direction: column; block-size: 100dvh; overflow: hidden; background: #f7f4ee; }
  .bar { flex: none; min-block-size: 58px; display: flex; align-items: center; padding: 0 16px;
         font-weight: 600; font-size: 20px; background: #e9dfcf; }
  .scroll { flex: 1; min-block-size: 0; overflow-y: auto; padding: 12px 16px 90px; }
  .card { background: #fff; border-radius: 20px; padding: 18px; margin: 12px 0; }
  .composer { flex: none; padding: 8px 12px; background: #efe9de; }
  .composer input { width: 100%; height: 48px; border-radius: 24px; border: 0; padding: 0 16px; font-size: 16px; }
  #m { font: 13px monospace; color: #b00; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="frame">
  <div class="bar" id="bar">→ Omer Serruya (thread bar)</div>
  <div class="scroll" id="scroll"><div id="m"></div><div class="card">הודעה 1</div><div class="card">הודעה 2</div></div>
  <div class="composer" id="composer"><input id="in" autofocus placeholder="כתבו הודעה"></div>
</div>
<script>
  var log = [];
  function note(t) {
    log.push(t + ': scrollY=' + Math.round(scrollY) + ' barTop=' + Math.round(document.getElementById('bar').getBoundingClientRect().top)
      + ' vv=' + Math.round(visualViewport.height) + '@' + Math.round(visualViewport.offsetTop));
    document.getElementById('m').textContent = log.join('\n');
  }
  document.getElementById('in').focus();
  setTimeout(function () { note('keyboard'); }, 2500);
  setTimeout(function () {
    document.getElementById('composer').remove();
    document.getElementById('bar').textContent = '→ מידע על הלקוח (top bar)';
    document.getElementById('scroll').innerHTML = '<div id="m"></div><div class="card">מה GOTCHA זוכרת</div><div class="card">שיחות קודמות</div><div class="card">הזמנות</div>';
    note('customer');
  }, 3500);
  setTimeout(function () { note('after 2s'); }, 5500);
  setTimeout(function () { note('after 6s'); }, 9500);
</script>
</body>
</html>
