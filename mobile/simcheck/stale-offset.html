<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* The /m frame (MobileShell .frame + a screen's 58px MobileBar), for the
     "customer info opens without its bar" check (Omer, 2026-11-15). The page
     grows taller than the screen for a moment and is scrolled 58px (what the
     keyboard does to the web view), then shrinks back to 100dvh. The bar must
     end at the top: scrollY=0, barTop=0. */
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #f7f4ee; font-family: -apple-system, sans-serif; }
  .frame { display: flex; flex-direction: column; block-size: 100dvh; overflow: hidden; background: #f7f4ee; }
  .bar { flex: none; min-block-size: 58px; display: flex; align-items: center; padding: 0 16px;
         font-weight: 600; font-size: 20px; background: #e9dfcf; }
  .scroll { flex: 1; min-block-size: 0; overflow-y: auto; padding: 12px 16px 90px; }
  .card { background: #fff; border-radius: 20px; padding: 18px; margin: 12px 0; }
  #m { font: 13px monospace; color: #b00; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="frame">
  <div class="bar" id="bar">→ מידע על הלקוח (top bar)</div>
  <div class="scroll"><div id="m"></div>
    <div class="card">מה GOTCHA זוכרת</div><div class="card">שיחות קודמות</div><div class="card">הזמנות</div>
  </div>
</div>
<script>
  var log = [];
  function note(t) {
    log.push(t + ': scrollY=' + Math.round(scrollY) + ' barTop=' + Math.round(document.getElementById('bar').getBoundingClientRect().top));
    document.getElementById('m').textContent = log.join('\n');
  }
  var spacer = document.createElement('div');
  spacer.style.height = '400px';
  document.body.appendChild(spacer);
  setTimeout(function () {
    window.scrollTo(0, 58); note('pushed');
    setTimeout(function () { spacer.remove(); note('shrunk'); }, 400);
    setTimeout(function () { note('after 2s'); }, 2400);
    setTimeout(function () { note('after 5s'); }, 5400);
  }, 800);
</script>
</body>
</html>
