# ⚠️⚠️  RETIRED. NOT THE PRODUCTION MANIFEST. DO NOT DEPLOY THIS FILE. ⚠️⚠️
#
# The production source of truth is `shopify.app.production.toml` (the ONE
# unified GOTCHA app, client_id b1ce3aa5…5f76). This Chat-app manifest
# describes a second Partner app that production no longer uses:
#
#   • its `application_url` below points at
#     `/api/connectors/shopify-chat/oauth/init`, a route that was DELETED with
#     the two-app split (see services/ai/src/routes/shopify-chat-install.ts).
#     Deploying this file would publish an install entry point that 404s.
#   • the Theme App Extension now ships inside the unified app.
#   • `scopes = ""` here, so a deploy against the wrong client_id would strip
#     all 26 scopes from every connected merchant.
#
# It is kept only as the record of what the Chat app was. If you are looking
# for the install flow, it is `/api/connectors/shopify/install` on the unified
# app - see docs/setup/shopify-install-flow.md.
#
# GOTCHA Chat - Shopify app manifest.
#
# ⚠️  THIS FILE CONFIGURES THE **GOTCHA SHOPIFY CHAT APP** ONLY.
#
# It must never be deployed against the GOTCHA Core Shopify Integration's
# Partner app (`SHOPIFY_API_KEY`). `include_config_on_deploy = true` means a
# deploy REPLACES the target app's scopes and redirect allowlist - pointing
# this at Core would strip read_orders/write_orders/read_customers/price
# rules/returns from every connected store and break their OAuth.
#
# `client_id` is written by `shopify app config link`. Before any CLI
# command run:
#
#     node scripts/shopify/verify-chat-app-identity.mjs
#
# which refuses when the linked id is missing, equals the Core app's, or
# disagrees with SHOPIFY_CHAT_APP_CLIENT_ID.
#
# The Admin API connection used for product truth is the SEPARATE Core
# integration (Settings → Integrations). This app introduces no second
# commerce credential.

name = "GOTCHA Chat"
handle = "gotcha-chat"

# Non-embedded: GOTCHA's merchant UI is its own application, not an iframe
# inside Shopify admin. There is no App Bridge and no session-token code,
# which is also why the authorization-code flow (not token exchange) is the
# correct install path for this app.
embedded = false

# Where Shopify sends a merchant who opens the app. Starts the install
# handshake when the shop is not yet bound, and lands on the onboarding
# wizard when it is.
application_url = "https://app.gotcha.co.il/api/connectors/shopify-chat/oauth/init"

[access_scopes]
# EMPTY BY DESIGN.
#
# The storefront widget needs no Admin API access: product truth comes from
# the Core integration's existing read_products grant through a safe
# server-side projection, and Add to Cart happens in the shopper's own
# browser against the theme's /cart/add.js.
#
# A `read_products` scope belongs here only in the same version that adds
# Chat token storage, rotation and a scope-upgrade flow. Requesting a scope
# nothing consumes is exactly what App Store review rejects.
scopes = ""

[auth]
redirect_urls = [
  "https://app.gotcha.co.il/api/connectors/shopify-chat/oauth/callback",
]

[webhooks]
# Kept in step with packages/shared/src/lib/shopify-api-version.ts. Webhook
# payload SHAPE is version-dependent, so dev and prod drifting apart meant dev
# never exercised the payloads prod receives. 2024-04 was ~15 months past end
# of support; 2026-07 is the newest RELEASED stable (supported to 2027-07-16).
# NOTE: this file only takes effect when the app is deployed to the Partner
# dashboard. Changing it here does not change the live subscription.
api_version = "2026-07"

  # Chat lifecycle. Handled by services/ai, verified with the CHAT secret.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://app.gotcha.co.il/api/shopify-chat/webhooks/app-uninstalled"

  # Mandatory compliance topics for public App Store distribution.
  [[webhooks.subscriptions]]
  topics = [ "customers/data_request" ]
  uri = "https://app.gotcha.co.il/api/shopify-chat/webhooks/customers-data-request"

  [[webhooks.subscriptions]]
  topics = [ "customers/redact" ]
  uri = "https://app.gotcha.co.il/api/shopify-chat/webhooks/customers-redact"

  [[webhooks.subscriptions]]
  topics = [ "shop/redact" ]
  uri = "https://app.gotcha.co.il/api/shopify-chat/webhooks/shop-redact"

[build]
include_config_on_deploy = true

[app_proxy]
# The ONLY way the storefront can prove which customer is chatting.
#
# The shopper's browser calls the merchant's own origin
# (https://<shop>/apps/gotcha-chat/...); Shopify then calls `url`
# server-to-server with `logged_in_customer_id` and a `signature` made
# with this app's secret. The browser never holds the secret, so it
# cannot forge the claim - which is exactly why Liquid's `customer.id`
# is not usable for this.
#
# No access scope is involved: identity comes from Shopify's signature,
# not from the Admin API. Reading that customer's ORDERS would need
# read_customers/read_orders and Protected Customer Data approval, which
# this app deliberately does not hold.
#
# `url` must match this config's host, or Shopify signs a request that
# arrives nowhere.
url = "https://app.gotcha.co.il/api/shopify-chat/proxy"
subpath = "gotcha-chat"
prefix = "apps"
