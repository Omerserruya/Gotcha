# GOTCHA - UNIFIED PRODUCTION Shopify app manifest.
#
# ⚠️  THIS FILE TARGETS THE LIVE GOTCHA APP THAT EVERY MERCHANT CONNECTS THROUGH.
#
# One app now owns everything: OAuth, the Admin API token, the scope set,
# webhooks, the app proxy, the Chat Theme App Extension and the storefront
# chat widget. There is no separate Chat app in production.
#
# Before ANY `shopify app` command:
#
#     node scripts/shopify/verify-unified-app-identity.mjs
#
# It fails closed and has no bypass flag. Run it every time, not once.
#
# ⚠️  THERE IS NO EXTENSION-ONLY DEPLOY. `shopify app deploy` ALWAYS PUBLISHES
# THIS ENTIRE FILE.
#
# An earlier version of this manifest carried `[build] include_config_on_deploy
# = false` and treated it as a safety catch. Shopify CLI 3.x removed the field:
# running `app deploy` prints "The `include_config_on_deploy` field is no
# longer supported and has been removed from your configuration file" and then
# strips it. Configuration and extensions ship together, always.
#
# That means every value below is published to the LIVE app the moment anyone
# deploys. An omission here is a REMOVAL there: a scope missing from this file
# is revoked on the app, and a redirect URL missing from this file stops
# working for every connected merchant. There is no undo.
#
# Therefore this file must be a faithful SUPERSET of the live configuration
# before any deploy. The live values have not been read back yet - see §7 of
# docs/setup/shopify-core-unified-production-runbook.md. Until that comparison
# is done and approved, do not deploy.

client_id = "b1ce3aa50d8d2e67b978918629bc5f76"

name = "GOTCHA"

# `handle` is intentionally ABSENT.
#
# It has not been read from Shopify, and it is not needed: this app is
# backend-driven rather than an embedded App Home, so nothing in the
# deployment path consumes it. A guessed handle only produces admin deep
# links that 404 for the merchant, and a wrong one would be PUBLISHED to the
# live app on the next deploy.
#
# Add it only when pulled directly from Shopify configuration. Its absence
# here is correct, not a gap, and the verifier does not treat it as one.
#
# `name` above is a LABEL, not an identity check. Names are editable and
# non-unique; identity is `client_id`, which is what Shopify keys the app on
# and the only value that cannot be true of two different apps.

# Non-embedded: GOTCHA's merchant UI is its own application, not an iframe
# inside Shopify admin. There is no App Bridge and no session-token code,
# which is why the authorization-code flow is the correct install path.
embedded = false

# CHANGED by this rollout: was https://gotcha.co.il (the marketing apex).
# The application now lives at app.gotcha.co.il, which is where every OAuth,
# proxy and webhook endpoint in this file resolves. The apex callback stays in
# the redirect allowlist below regardless.
application_url = "https://app.gotcha.co.il"

[access_scopes]
# The approved 26. Written in FULL, never in the collapsed form Shopify
# returns from /admin/oauth/access_scopes.json: that response omits a
# `read_X` when `write_X` is granted, and copying it back would silently
# drop 6 scopes from the request.
#
# `write_merchant_managed_fulfillment_orders` is in this set because
# `update_order_fulfillment` requires it (shopify.adapter.ts). It was absent
# from the earlier 25-scope draft, which would have left that tool unable to
# succeed.
scopes = "read_all_orders,read_assigned_fulfillment_orders,read_customers,write_customers,read_price_rules,write_price_rules,read_discounts,write_discounts,read_draft_orders,read_fulfillments,read_inventory,read_inventory_shipments,read_inventory_shipments_received_items,read_inventory_transfers,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,write_order_edits,read_order_edits,read_orders,write_orders,read_product_feeds,read_product_listings,read_products,read_returns,write_returns,read_third_party_fulfillment_orders"

[auth]
# The Core OAuth callback, matching SHOPIFY_REDIRECT_URI in .env.prod.
#
# ⚠️  This list REPLACES the live allowlist on every deploy. Any redirect
# registered on the app and missing here stops working.
#
# All THREE currently-released callbacks are listed, confirmed live by the
# app owner on 2026-08-04. `gotcha.co.il` is the apex the app was originally
# registered against and `dev.gotcha.co.il` serves development installs;
# neither is dropped by this rollout even though the application_url moves to
# app.gotcha.co.il. Removing either would break OAuth for anything still
# pointed at it, and a redirect costs nothing to keep.
redirect_urls = [
  "https://app.gotcha.co.il/api/connectors/shopify/oauth/callback",
  "https://gotcha.co.il/api/connectors/shopify/oauth/callback",
  "https://dev.gotcha.co.il/api/connectors/shopify/oauth/callback",
]

[webhooks]
# 2026-04 because that is what the app is LIVE on, confirmed by the app owner.
#
# Deliberately NOT the 2026-07 pin in packages/shared/src/lib/shopify-api-version.ts:
# that constant governs ADMIN API calls the services make, which is a separate
# contract from the version Shopify uses to shape webhook PAYLOADS. Publishing
# 2026-07 here would silently re-version every live subscription to a payload
# shape nothing has exercised, to gain nothing - the handlers read `shop_domain`
# and verify an HMAC over raw bytes, neither of which is version-sensitive.
#
# Preserve what is live; change it deliberately, in its own change, if ever.
api_version = "2026-04"

  # Commerce lifecycle. Verified against the CORE secret (SHOPIFY_API_SECRET).
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://app.gotcha.co.il/api/connectors/shopify/webhooks/app-uninstalled"

  # Mandatory compliance topics for public App Store distribution.
  #
  # These are NOT ordinary subscriptions: declaring them under
  # [[webhooks.subscriptions]] is rejected outright ("The following topic is
  # invalid: customers/data_request"). Shopify requires this named block.
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://app.gotcha.co.il/api/connectors/shopify/webhooks/customers-data-request"
  customer_deletion_url = "https://app.gotcha.co.il/api/connectors/shopify/webhooks/customers-redact"
  shop_deletion_url = "https://app.gotcha.co.il/api/connectors/shopify/webhooks/shop-redact"

[app_proxy]
# The ONLY way the storefront can prove which customer is chatting.
#
# The shopper's browser calls the merchant's own origin
# (https://<shop>/apps/gotcha-chat/...); Shopify then calls `url`
# server-to-server with `logged_in_customer_id` and a `signature` made with
# THIS app's secret. The browser never holds the secret, so it cannot forge
# the claim - which is why Liquid's `customer.id` is not usable for this.
#
# Under the unified app the signing secret is the CORE secret. The runtime
# verification path moves with it; see shopify-chat-public.ts.
url = "https://app.gotcha.co.il/api/shopify-chat/proxy"
subpath = "gotcha-chat"
prefix = "apps"
