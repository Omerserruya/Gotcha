server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets
    location /_next/static/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Static export uses trailingSlash:true → /foo/ resolves to /foo/index.html.
    # Unknown URLs (user-generated [id] paths) fall back to /index.html so the
    # SPA client router can mount the matching route.
    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }

    # No backend on this container - caching/health only.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
