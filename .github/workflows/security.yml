name: Security Gates

# Supply-chain + secret-scanning gates (ISO 27001 A.8.8 / A.8.25-28).
# Runs on every push and PR. `npm audit` fails the build on a HIGH/CRITICAL
# advisory in the PRODUCTION dependency tree (dev-only advisories do not block,
# since the two-stage Docker build ships production deps only).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (prod deps, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install (lockfile only, no scripts)
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    # Scoped to this job rather than widened at the top of the file. The action
    # reads the PR's commit range through the API, which needs pull-requests
    # beyond the repo-wide contents:read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: gitleaks scans the commit range, so a shallow clone
          # silently narrows what is examined rather than failing.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # v2 requires this to scan a pull request and errors out without it.
          # Absent, the job failed on every PR regardless of content - which is
          # a secret scanner that never scanned, and reads identically to a
          # scanner that found nothing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Typecheck all workspaces
        run: npm run typecheck --workspaces --if-present
