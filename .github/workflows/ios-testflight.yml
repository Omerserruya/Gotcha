# Runs on the mobile-android branch, which carries only mobile/ on top of main.
# Builds the GOTCHA iPhone app for production (app.gotcha.co.il), signs it for
# the App Store and uploads it to App Store Connect, where it shows in TestFlight.
#
# Triggered by pushing a tag "ios-*" (or by hand), never by an ordinary push:
# every run is a new build in App Store Connect (Omer approved the signing
# secrets in GitHub, 2026-11-14).
#
# Secrets (the originals are kept in /home/ocs/secrets on the dev box):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64  App Store Connect API key (upload)
#   APPLE_TEAM_ID                                  G465C5Q273
#   IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD     "Apple Distribution" certificate + key
#   IOS_APPSTORE_PROFILE_BASE64                    profile "GOTCHA App Store" (expires 2027-11-14)
# The build number is this workflow's run number.
name: iOS TestFlight

on:
  push:
    tags: ['ios-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Capacitor
        run: npm ci --no-audit --no-fund

      - name: Sync (prod)
        run: GOTCHA_ENV=prod npx cap sync ios

      - name: Install the signing certificate and profile
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/gotcha-appstore.mobileprovision"
          rm "$RUNNER_TEMP/dist.p12"

      # Manual signing for the App target only (the SPM packages are not signed).
      - name: Sign the App target manually
        working-directory: mobile/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\"; PROVISIONING_PROFILE_SPECIFIER = \"GOTCHA App Store\";/" App.xcodeproj/project.pbxproj
          grep -c 'PROVISIONING_PROFILE_SPECIFIER = "GOTCHA App Store"' App.xcodeproj/project.pbxproj

      - name: Archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Export the .ipa
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>il.co.gotcha.app</key><string>GOTCHA App Store</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -l "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          xcrun altool --upload-app -t ios -f "$RUNNER_TEMP/export/App.ipa" --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
