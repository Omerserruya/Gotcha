# ─── Security response headers (H-5) ─────────────────────────────────────────
# Applied to responses served by the gateway. This file is `include`d at the
# server scope of every server block AND re-`include`d inside any location that
# defines its own add_header, because nginx add_header does NOT inherit into a
# location that sets its own add_header (e.g. /health, /_next/static/).
#
# It is deliberately NOT included in the /api/embedded-chat location: that widget
# is embedded cross-site inside customer pages, so it must stay framable - no
# X-Frame-Options / CSP frame-ancestors there.
#
# Wiring: baked into the prod image by gateway/Dockerfile.prod (COPY) and
# bind-mounted into the dev gateway by docker-compose.yml. Contains no nginx
# variables, so envsubst leaves it untouched.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# Next.js SPA needs 'unsafe-inline'/'unsafe-eval' for its runtime and inline
# styles; frame-ancestors 'none' still blocks clickjacking of the app itself.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
