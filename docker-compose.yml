services:
  # ─── Infrastructure ──────────────────────────────────────
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_cc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    # Append-only persistence + a volume, matching docker-compose.prod.yml.
    #
    # Redis is a CACHE again now that TenantSetting is the source of truth, but
    # it had been holding the only copy of every tenant's business hours,
    # auto-greeting and SLA targets - and dev declared no volume for it, while
    # pgdata, qdrant_data and uploads all had one. Every `docker compose down`
    # erased them here, silently: a missing business-hours config reads as
    # "open" by design, so the tenant just became 24/7 with no error anywhere.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    restart: unless-stopped
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Authentik (identity provider) ───────────────────────
  # Authentik owns ALL authentication: credentials, sessions, MFA, recovery,
  # email verification. It gets its OWN database - GOTCHA business data and
  # identity data must never share a schema. GOTCHA never writes to it except
  # via the admin API (invitations).
  authentik-db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${AUTHENTIK_PG_USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS:-authentik}
      POSTGRES_DB: ${AUTHENTIK_PG_DB:-authentik}
    volumes:
      - authentik_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTHENTIK_PG_USER:-authentik}"]
      interval: 5s
      timeout: 5s
      retries: 10

  authentik-server:
    restart: unless-stopped
    image: ghcr.io/goauthentik/server:2024.10
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-dev-only-authentik-secret-key-change-in-production}
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB:-authentik}
      # Shared redis, dedicated logical DB so Authentik keys never collide
      # with BullMQ queues on db 0.
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__DB: 1
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      # ════════════════════════════════════════════════════════════════════════
      # ★★ SCOPED TO THE APEX, AND DEV WAS THE ONLY ENVIRONMENT WITHOUT IT
      # ════════════════════════════════════════════════════════════════════════
      # Unset, Authentik issues `authentik_session` with NO `Domain` attribute,
      # which makes it HOST-ONLY - measured on 2026-09-28:
      #
      #   set-cookie: authentik_session=...; HttpOnly; Path=/; SameSite=None; Secure
      #
      # A session established under `dev.gotcha.co.il` is then never sent to
      # `auth-dev.gotcha.co.il`, so anything that authenticates on one host and
      # authorises on the other succeeds and is immediately asked to sign in
      # again. That is the blocker for serving our own sign-in UI against the
      # flow-executor API from the product's own origin.
      #
      # `docker-compose.prod.yml:179` has carried this since it was written.
      # **Dev was the odd one out**, so this is not a new decision - it is dev
      # catching up with the environment the work ships to, which is also why
      # the risk is known rather than estimated.
      #
      # Changing it restarts the IdP and invalidates live sessions. Authorised
      # by Omer, 2026-09-28, for dev only.
      AUTHENTIK_COOKIE_DOMAIN: ${AUTHENTIK_COOKIE_DOMAIN:-gotcha.co.il}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@gotcha.co.il}
      AUTHENTIK_EMAIL__HOST: ${SMTP_HOST:-}
      AUTHENTIK_EMAIL__PORT: ${SMTP_PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${SMTP_USER:-}
      AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASS:-}
      # STARTTLS is mandatory for Gmail on 587 - without it the server never
      # advertises AUTH and every send fails with SMTPNotSupportedError.
      AUTHENTIK_EMAIL__USE_TLS: ${SMTP_USE_TLS:-true}
      AUTHENTIK_EMAIL__FROM: ${SMTP_FROM:-noreply@gotcha.co.il}
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      # GOTCHA-branded recovery email (referenced by the email stage's template
      # field, set in scripts/authentik/bootstrap.mjs).
      - ./scripts/authentik/templates/gotcha_password_reset.html:/templates/gotcha_password_reset.html:ro
      # GOTCHA theme: served at /static/dist/..., injected into the flow UI's
      # shadow roots via the data-inject stylesheet hook.
      - ./scripts/authentik/custom.css:/web/dist/custom.css:ro
      - ./frontend/public/logo_icon.png:/web/dist/assets/custom/logo_icon.png:ro
      # GOTCHA favicon for the Authentik browser tab (served at
      # /static/dist/assets/custom/gotcha-favicon.ico). Referenced by the brand's
      # branding_favicon, set in scripts/authentik/bootstrap.mjs.
      - ./frontend/public/favicon.ico:/web/dist/assets/custom/gotcha-favicon.ico:ro
      - ./frontend/public/full_icon_white.png:/web/dist/assets/custom/full_icon_white.png:ro
      - ./frontend/public/authentik-enhance.js:/web/dist/assets/custom/authentik-enhance.js:ro
    ports:
      - "${AUTHENTIK_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      authentik-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  authentik-worker:
    restart: unless-stopped
    image: ghcr.io/goauthentik/server:2024.10
    command: worker
    environment: *authentik-env
    user: root
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      # The worker is the process that actually renders + sends stage emails.
      - ./scripts/authentik/templates/gotcha_password_reset.html:/templates/gotcha_password_reset.html:ro
      # NOTE: the host Docker socket is intentionally NOT mounted. Authentik's
      # worker does not need it for our deployment, and exposing the socket to a
      # root container is a container-escape path (M-7). Prod never mounted it.
    depends_on:
      authentik-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── API Gateway ─────────────────────────────────────────
  # ─── API documentation (DEV ONLY) ──────────────────────────
  #
  # Swagger UI for docs/openapi.yaml, reachable through the dev gateway at
  # /api/docs/. Deliberately a container rather than `swagger-ui-express` in a
  # service: this repo forbids new npm dependencies, and dev and prod share the
  # same Docker runtime stage (`npm ci --omit=dev`), so a devDependency would
  # not be installed in dev either - it would have to become a real dependency
  # shipped unused into every production image. A compose service costs prod
  # nothing and cannot leak there, because docker-compose.prod.yml does not
  # define it.
  #
  # Regenerate the spec it serves with `npm run api:docs`.
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    ports:
      # Reachable standalone, which matters: the gateway refuses to start
      # unless EVERY upstream resolves, so tying the docs to it would make them
      # unavailable exactly when half the stack is down and you most want to
      # look something up.
      - "${SWAGGER_UI_PORT:-8088}:8080"
    volumes:
      # Mounted rather than fetched over HTTP so the UI works on both paths -
      # standalone on the published port, and proxied through the gateway.
      - ./docs/openapi.yaml:/spec/openapi.yaml:ro
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      # The spec describes ~780 endpoints; without this the UI expands every
      # operation on load and takes seconds to become interactive.
      DOC_EXPANSION: none
      DEEP_LINKING: "true"
      DISPLAY_REQUEST_DURATION: "true"
    restart: unless-stopped

  gateway:
    restart: unless-stopped
    image: nginx:alpine
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      # The generated OpenAPI spec, served read-only at /api/docs/openapi.yaml.
      # DEV ONLY: docker-compose.prod.yml has no equivalent mount and the prod
      # nginx template has no /api/docs location, so the spec is unreachable in
      # production by construction rather than by a runtime check.
      - ./docs:/usr/share/nginx/api-docs:ro
    environment:
      AUTH_PORT: ${AUTH_PORT:-4001}
      CONVERSATION_PORT: ${CONVERSATION_PORT:-4002}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-4003}
      ANALYTICS_PORT: ${ANALYTICS_PORT:-4004}
      CHATBOT_PORT: ${CHATBOT_PORT:-4005}
      AI_PORT: ${AI_PORT:-4006}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      VOICE_COPILOT_PORT: ${VOICE_COPILOT_PORT:-4007}
      NOTIFICATIONS_PORT: ${NOTIFICATIONS_PORT:-4008}
      BILLING_PORT: ${BILLING_PORT:-4009}
      # Public pricing kill switch (see nginx template). Default false.
      PUBLIC_PRICING_ENABLED: ${PUBLIC_PRICING_ENABLED:-false}
      # envsubst uses an allowlist - a var missing from the list below stays a
      # literal in the rendered config and nginx refuses to start.
      AUTHENTIK_PORT: ${AUTHENTIK_PORT:-9000}
    command: >
      sh -c "envsubst '$$AUTH_PORT $$CONVERSATION_PORT $$WEBHOOK_PORT $$ANALYTICS_PORT $$CHATBOT_PORT $$AI_PORT $$FRONTEND_PORT $$VOICE_COPILOT_PORT $$NOTIFICATIONS_PORT $$BILLING_PORT $$AUTHENTIK_PORT $$PUBLIC_PRICING_ENABLED'
      < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - auth
      - conversation
      - webhook
      - analytics
      - chatbot
      - ai
      - frontend
      - voice-copilot
      - notifications
      # nginx resolves every upstream at startup, so the authentik-server name
      # must exist or the gateway dies with "host not found in upstream".
      - authentik-server

  # ─── Microservices ───────────────────────────────────────
  auth:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      # ── Data retention (GDPR Art. 5(1)(e)) ──
      #
      # DELETE SCHEDULES. Every one of these is empty, and that is the
      # current intent: the wiring exists and is verifiable while nothing
      # is deleted. A value here starts removing rows for every tenant
      # that has not set its own policy.
      #
      # THEY MUST BE SET ON BOTH `ai` AND `auth`, AND THE SAME.
      # `ai` runs the purge; `auth` serves GET /api/gdpr/retention, which
      # reports what is in force. Set one and not the other and the
      # engine deletes while the API reports nothing configured - which
      # is the exact defect a42d4c78 fixed, reintroduced through
      # configuration instead of code.
      #
      # Read-side only: auth does not purge, it reports.
      RETENTION_DEFAULT_MESSAGES_DAYS: ${RETENTION_DEFAULT_MESSAGES_DAYS:-}
      RETENTION_DEFAULT_USAGE_LOGS_DAYS: ${RETENTION_DEFAULT_USAGE_LOGS_DAYS:-}
      RETENTION_DEFAULT_AUDIT_LOGS_DAYS: ${RETENTION_DEFAULT_AUDIT_LOGS_DAYS:-}
      RETENTION_DEFAULT_BILLING_WEBHOOK_EVENTS_DAYS: ${RETENTION_DEFAULT_BILLING_WEBHOOK_EVENTS_DAYS:-}
      RETENTION_DEFAULT_REASONER_SHADOW_EVALS_DAYS: ${RETENTION_DEFAULT_REASONER_SHADOW_EVALS_DAYS:-}
      RETENTION_DEFAULT_AGENT_LOOP_RUNS_DAYS: ${RETENTION_DEFAULT_AGENT_LOOP_RUNS_DAYS:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${AUTH_PORT:-4001}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      # Auth calls billing's internal endpoints (paid-tenant provisioning).
      # Without this every such call 401s and provisioning silently fails.
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-chatcenter-internal-2026}
      BILLING_SERVICE_URL: ${BILLING_SERVICE_URL:-http://billing:4009}
      # Admin API access for provisioning invited identities. ONLY the auth
      # service gets this token - no other service may create identities.
      AUTHENTIK_URL: ${AUTHENTIK_URL:-http://authentik-server:9000}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:-${AUTHENTIK_BOOTSTRAP_TOKEN:-}}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-gotcha-app}
      # BFF app-session (migration §A5). INERT unless SESSION_COOKIE_CREATE=true.
      # Server-side token exchange reuses AUTHENTIK_URL (internal DNS) above.
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
      SESSION_ENCRYPTION_KEY_ID: ${SESSION_ENCRYPTION_KEY_ID:-k1}
      APP_ORIGIN: ${APP_ORIGIN:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-}
      SESSION_COOKIE_CREATE: ${SESSION_COOKIE_CREATE:-false}
      SESSION_COOKIE_ACCEPT: ${SESSION_COOKIE_ACCEPT:-false}
      LEGACY_BEARER_ACCEPT: ${LEGACY_BEARER_ACCEPT:-}
      COOKIE_ONLY_ENFORCE: ${COOKIE_ONLY_ENFORCE:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ${WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID:-}
      # Mirrors the prod compose. Compose maps variables one by one here too, so
      # an unlisted variable is indistinguishable from an unset one - which is
      # how setting WHATSAPP_ES_FEATURE_TYPE in .env did nothing for anybody.
      WHATSAPP_ES_VERSION: ${WHATSAPP_ES_VERSION:-}
      WHATSAPP_ES_FEATURE_TYPE: ${WHATSAPP_ES_FEATURE_TYPE:-}
      WHATSAPP_ES_SESSION_INFO_VERSION: ${WHATSAPP_ES_SESSION_INFO_VERSION:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_OAUTH_REDIRECT_URI: ${INSTAGRAM_OAUTH_REDIRECT_URI:-}
      FACEBOOK_API_URL: ${FACEBOOK_API_URL:-}
      INSTAGRAM_API_URL: ${INSTAGRAM_API_URL:-https://graph.instagram.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      INTEGRATION_REQUEST_EMAIL: ${INTEGRATION_REQUEST_EMAIL:-}
      SYSTEM_ADMIN_SETUP_SECRET: ${SYSTEM_ADMIN_SETUP_SECRET:-change-me-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ONBOARDING_CHAT_MODEL: ${ONBOARDING_CHAT_MODEL:-gpt-4o-mini}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # New-lead alerts into a WhatsApp group. Optional: unset means the
      # signup still works and only Telegram hears about it. Needs a WhatsApp
      # Web bridge (WAHA) reachable from this container - the Meta Cloud API
      # cannot post to a group at all. CHAT_ID is the group's `<id>@g.us`.
      WHATSAPP_ALERT_API_URL: ${WHATSAPP_ALERT_API_URL:-}
      WHATSAPP_ALERT_API_KEY: ${WHATSAPP_ALERT_API_KEY:-}
      WHATSAPP_ALERT_SESSION: ${WHATSAPP_ALERT_SESSION:-}
      WHATSAPP_ALERT_CHAT_ID: ${WHATSAPP_ALERT_CHAT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_REDIRECT_URI: ${MICROSOFT_OAUTH_REDIRECT_URI:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_OAUTH_REDIRECT_URI: ${SLACK_OAUTH_REDIRECT_URI:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  conversation:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/conversation/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-dev}
    environment:
      # Verifies storefront visitor sessions minted by services/ai.
      # Same secret, same failure mode: unset in production means
      # every Shopify Live Chat visitor session is rejected.
      WIDGET_SESSION_SECRET: ${WIDGET_SESSION_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      # Paid-access gate - see the `ai` service for the full note. Present here
      # because this service can produce billable work on its own, and a service
      # without this variable defaults to "off", which is a bypass path.
      BILLING_ENFORCEMENT_MODE: ${BILLING_ENFORCEMENT_MODE:-enforce}
      BILLING_PAST_DUE_GRACE_HOURS: ${BILLING_PAST_DUE_GRACE_HOURS:-72}
      BILLING_ALLOW_UNENFORCED: ${BILLING_ALLOW_UNENFORCED:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${CONVERSATION_PORT:-4002}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      SESSION_COOKIE_ACCEPT: ${SESSION_COOKIE_ACCEPT:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-}
      LEGACY_BEARER_ACCEPT: ${LEGACY_BEARER_ACCEPT:-}
      COOKIE_ONLY_ENFORCE: ${COOKIE_ONLY_ENFORCE:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-}
      PUBLIC_URL: ${NEXT_PUBLIC_API_URL:-}
      # Public HTTPS base for outbound Twilio webhook URLs (used by /api/voice-channels)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-chatcenter-internal-2026}
      # Billing provisioning on onboarding completion (entity + trial + Units).
      BILLING_SERVICE_URL: ${BILLING_SERVICE_URL:-http://billing:4009}
      # Required for the Meta Resumable Upload API path that mints media
      # handles for IMAGE/VIDEO/DOCUMENT WhatsApp template examples.
      META_APP_ID: ${META_APP_ID:-}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  webhook:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/webhook/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${WEBHOOK_PORT:-4003}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      SESSION_COOKIE_ACCEPT: ${SESSION_COOKIE_ACCEPT:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-}
      LEGACY_BEARER_ACCEPT: ${LEGACY_BEARER_ACCEPT:-}
      COOKIE_ONLY_ENFORCE: ${COOKIE_ONLY_ENFORCE:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      # Instagram Login is a SEPARATE Meta app with its own secret, and Meta
      # signs each delivery with the secret of the app that owns the
      # subscription. Without this the webhook verifies IG payloads with the
      # Facebook app's secret, the HMAC never matches, and every Instagram
      # message is dropped fail-closed while the channel still reads CONNECTED.
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
      GMAIL_PUBSUB_TOKEN: ${GMAIL_PUBSUB_TOKEN:-}
      OUTLOOK_WEBHOOK_CLIENT_STATE: ${OUTLOOK_WEBHOOK_CLIENT_STATE:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${ANALYTICS_PORT:-4004}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      SESSION_COOKIE_ACCEPT: ${SESSION_COOKIE_ACCEPT:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-}
      LEGACY_BEARER_ACCEPT: ${LEGACY_BEARER_ACCEPT:-}
      COOKIE_ONLY_ENFORCE: ${COOKIE_ONLY_ENFORCE:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  chatbot:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/chatbot/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      # Paid-access gate - see the `ai` service for the full note. Present here
      # because this service can produce billable work on its own, and a service
      # without this variable defaults to "off", which is a bypass path.
      BILLING_ENFORCEMENT_MODE: ${BILLING_ENFORCEMENT_MODE:-enforce}
      BILLING_PAST_DUE_GRACE_HOURS: ${BILLING_PAST_DUE_GRACE_HOURS:-72}
      BILLING_ALLOW_UNENFORCED: ${BILLING_ALLOW_UNENFORCED:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${CHATBOT_PORT:-4005}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      SESSION_COOKIE_ACCEPT: ${SESSION_COOKIE_ACCEPT:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-}
      LEGACY_BEARER_ACCEPT: ${LEGACY_BEARER_ACCEPT:-}
      COOKIE_ONLY_ENFORCE: ${COOKIE_ONLY_ENFORCE:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/ai/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-dev}
    environment:
      # ── Data retention (GDPR Art. 5(1)(e)) ──
      #
      # DELETE SCHEDULES. Every one of these is empty, and that is the
      # current intent: the wiring exists and is verifiable while nothing
      # is deleted. A value here starts removing rows for every tenant
      # that has not set its own policy.
      #
      # THEY MUST BE SET ON BOTH `ai` AND `auth`, AND THE SAME.
      # `ai` runs the purge; `auth` serves GET /api/gdpr/retention, which
      # reports what is in force. Set one and not the other and the
      # engine deletes while the API reports nothing configured - which
      # is the exact defect a42d4c78 fixed, reintroduced through
      # configuration instead of code.
      #
      # `messages` and `usage_logs` are deliberately the two nobody has proposed a default for: customer conversation content and the billing ledger.
      RETENTION_DEFAULT_MESSAGES_DAYS: ${RETENTION_DEFAULT_MESSAGES_DAYS:-}
      RETENTION_DEFAULT_USAGE_LOGS_DAYS: ${RETENTION_DEFAULT_USAGE_LOGS_DAYS:-}
      RETENTION_DEFAULT_AUDIT_LOGS_DAYS: ${RETENTION_DEFAULT_AUDIT_LOGS_DAYS:-}
      RETENTION_DEFAULT_BILLING_WEBHOOK_EVENTS_DAYS: ${RETENTION_DEFAULT_BILLING_WEBHOOK_EVENTS_DAYS:-}
      RETENTION_DEFAULT_REASONER_SHADOW_EVALS_DAYS: ${RETENTION_DEFAULT_REASONER_SHADOW_EVALS_DAYS:-}
      RETENTION_DEFAULT_AGENT_LOOP_RUNS_DAYS: ${RETENTION_DEFAULT_AGENT_LOOP_RUNS_DAYS:-}
      # Engine-only. Unset means the documented default: 03:30 daily, enabled.
      RETENTION_PURGE_CRON: ${RETENTION_PURGE_CRON:-}
      RETENTION_PURGE_ENABLED: ${RETENTION_PURGE_ENABLED:-}
      # Decides whether unpaid or suspended organizations are refused AI.
      # Undeclared means "off", which fails OPEN - so it is stated here
      # rather than left to a default nobody sees.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${AI_PORT:-4006}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      SESSION_COOKIE_ACCEPT: ${SESSION_COOKIE_ACCEPT:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-}
      LEGACY_BEARER_ACCEPT: ${LEGACY_BEARER_ACCEPT:-}
      COOKIE_ONLY_ENFORCE: ${COOKIE_ONLY_ENFORCE:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-5-mini}
      # ── Paid-access gate: off|audit|enforce (hard/soft/observe still accepted).
      # Checks BOTH halves of the question - is the organization commercially in
      # good standing, AND does their plan include the capability being used.
      # A tenant with NO subscription is now DENIED, not allowed: that was the
      # hole through which unpaid organizations kept being served. Grandfathered
      # subscriptions skip the gate by design, recorded on the row.
      # Production runs `enforce`; services refuse to boot on a missing or
      # misspelt value, because both would silently mean "nobody has to pay". ──
      BILLING_ENFORCEMENT_MODE: ${BILLING_ENFORCEMENT_MODE:-enforce}
      # Hours a failed renewal keeps working, so an expired card is not treated
      # as harshly as never paying.
      BILLING_PAST_DUE_GRACE_HOURS: ${BILLING_PAST_DUE_GRACE_HOURS:-72}
      # Only meaningful with mode=off in production: an explicit acknowledgement
      # that the deployment is deliberately running unenforced.
      BILLING_ALLOW_UNENFORCED: ${BILLING_ALLOW_UNENFORCED:-}
      BILLING_SERVICE_URL: ${BILLING_SERVICE_URL:-http://billing:4009}
      # Set OPENAI_LOG=debug to log the FULL outbound OpenAI request (system
      # prompt + messages + tool schemas) and response to stdout. Off by default.
      OPENAI_LOG: ${OPENAI_LOG:-}
      # Debug-only: with NODE_OPTIONS set, the inspect-deep preload stops Node
      # from truncating the OPENAI_LOG output to [Array]/[Object]. Off by default.
      NODE_OPTIONS: ${AI_NODE_OPTIONS:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
      CONFLUENCE_CLIENT_ID: ${CONFLUENCE_CLIENT_ID:-}
      CONFLUENCE_CLIENT_SECRET: ${CONFLUENCE_CLIENT_SECRET:-}
      CONFLUENCE_REDIRECT_URI: ${CONFLUENCE_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-}
      CALENDLY_CLIENT_ID: ${CALENDLY_CLIENT_ID:-}
      CALENDLY_CLIENT_SECRET: ${CALENDLY_CLIENT_SECRET:-}
      CALENDLY_REDIRECT_URI: ${CALENDLY_REDIRECT_URI:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      ZOHO_REDIRECT_URI: ${ZOHO_REDIRECT_URI:-}
      ZOHO_ACCOUNTS_URL: ${ZOHO_ACCOUNTS_URL:-https://accounts.zoho.com}
      # ── Marketplace OAuth providers (read by services/ai/src/routes/connectors-admin.ts) ──
      STRIPE_CLIENT_ID: ${STRIPE_CLIENT_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_REDIRECT_URI: ${STRIPE_REDIRECT_URI:-}
      HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
      HUBSPOT_REDIRECT_URI: ${HUBSPOT_REDIRECT_URI:-}
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:-}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:-}
      SHOPIFY_REDIRECT_URI: ${SHOPIFY_REDIRECT_URI:-}
      # OPTIONAL. The Shopify App Store listing handle, read FROM the Partner
      # Dashboard once the listing is published. Derives the one Shopify-owned
      # page the merchant-facing "Connect Shopify" button can send someone to
      # (https://apps.shopify.com/<handle>), because GOTCHA never asks for a
      # .myshopify.com domain (App Store requirement 2.3.1).
      #
      # Empty is a NORMAL pre-listing state and blocks only that button. It
      # does NOT affect installation from the Partner Dashboard, the public
      # install handler, OAuth, the callback, existing connections, or
      # reauthorization - none of those read it.
      #
      # Never guessed: a wrong handle is a 404 the merchant cannot get past.
      # There is deliberately no SHOPIFY_APP_INSTALL_URL twin - a custom
      # distribution link is generated per store and would hard-code one
      # merchant's shop into everyone's button.
      SHOPIFY_APP_HANDLE: ${SHOPIFY_APP_HANDLE:-}
      # Split out of SHOPIFY_APP_HANDLE in App Store review 132211. Shopify uses
      # "handle" for two different identifiers and they are not guaranteed to
      # match:
      #   SHOPIFY_APP_STORE_HANDLE   the App Store LISTING slug, used only in
      #                              https://apps.shopify.com/<slug>
      #   SHOPIFY_APP_PRICING_HANDLE the APP handle, used in admin deep links
      #                              such as /charges/<handle>/pricing_plans
      # Both fall back to SHOPIFY_APP_HANDLE when unset, so this is additive.
      SHOPIFY_APP_STORE_HANDLE: ${SHOPIFY_APP_STORE_HANDLE:-}
      SHOPIFY_APP_PRICING_HANDLE: ${SHOPIFY_APP_PRICING_HANDLE:-}
      SHOPIFY_APP_STORE_SEARCH_TERM: ${SHOPIFY_APP_STORE_SEARCH_TERM:-GOTCHA}
      # Is the App Store listing APPROVED and publicly reachable?
      #
      # OFF until Shopify approves the listing. An unapproved listing 404s for
      # anyone not signed in to a Partner account, and a "Limited visibility"
      # app never appears in App Store search even after approval - so before
      # approval there is nowhere to send a merchant, and the button explains
      # that installation begins on Shopify instead of navigating to a 404.
      #
      # Flip this to "true" on approval day. No rebuild, no code change.
      SHOPIFY_APP_STORE_LISTING_LIVE: ${SHOPIFY_APP_STORE_LISTING_LIVE:-false}
      # Optional. Where to point a merchant while the listing is not public -
      # during App Store review, the install link from the Shopify dashboard.
      # Shown as HELP beside the explanation, never as the install path, and
      # never constructed by us. Unset is fine: the explanation stands alone.
      SHOPIFY_INSTALL_HELP_URL: ${SHOPIFY_INSTALL_HELP_URL:-}
      SHOPIFY_PENDING_INSTALL_TTL_SECONDS: ${SHOPIFY_PENDING_INSTALL_TTL_SECONDS:-}
      # ── GOTCHA Shopify CHAT app ───────────────────────────────────
      # RETIRED at the Core/Chat unification. There is ONE Shopify app now,
      # so app-proxy signatures, webhook HMACs and the Theme Editor deep
      # link all derive from SHOPIFY_API_KEY / SHOPIFY_API_SECRET above.
      #
      # SHOPIFY_CHAT_APP_CLIENT_ID / _SECRET are deliberately NOT re-declared
      # pointing at the Core values: two environment names for one secret
      # means the first rotation that misses one breaks proxy verification
      # with an error that reads like a misconfigured proxy.
      SHOPIFY_CHAT_APP_URL: ${SHOPIFY_CHAT_APP_URL:-https://dev.gotcha.co.il}
      SHOPIFY_CHAT_REDIRECT_URI: ${SHOPIFY_CHAT_REDIRECT_URI:-https://dev.gotcha.co.il/api/connectors/shopify-chat/oauth/callback}
      # The App Embed BLOCK handle is the .liquid file name (underscore),
      # NOT the extension handle (hyphen). The Theme Editor deep link is
      # built from it and silently opens nothing when it is wrong.
      SHOPIFY_CHAT_BLOCK_HANDLE: ${SHOPIFY_CHAT_BLOCK_HANDLE:-gotcha_chat}
      SHOPIFY_CHAT_EXTENSION_HANDLE: ${SHOPIFY_CHAT_EXTENSION_HANDLE:-gotcha-chat}
      SHOPIFY_CHAT_APP_HANDLE: ${SHOPIFY_CHAT_APP_HANDLE:-gotcha-chat-dev}
      # Empty by design in v1 - the Chat app needs no Admin API access.
      SHOPIFY_CHAT_SCOPES: ${SHOPIFY_CHAT_SCOPES:-}
      # Encrypts storefront visitor sessions. Mandatory in production:
      # without it signVisitorSession() throws and no widget can start.
      WIDGET_SESSION_SECRET: ${WIDGET_SESSION_SECRET:-}
      WIX_CLIENT_ID: ${WIX_CLIENT_ID:-}
      WIX_CLIENT_SECRET: ${WIX_CLIENT_SECRET:-}
      WIX_REDIRECT_URI: ${WIX_REDIRECT_URI:-}
      SQUARE_APPLICATION_ID: ${SQUARE_APPLICATION_ID:-}
      SQUARE_APPLICATION_SECRET: ${SQUARE_APPLICATION_SECRET:-}
      SQUARE_REDIRECT_URI: ${SQUARE_REDIRECT_URI:-}
      SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-}
      SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-}
      SALESFORCE_REDIRECT_URI: ${SALESFORCE_REDIRECT_URI:-}
      MONDAY_CLIENT_ID: ${MONDAY_CLIENT_ID:-}
      MONDAY_CLIENT_SECRET: ${MONDAY_CLIENT_SECRET:-}
      MONDAY_REDIRECT_URI: ${MONDAY_REDIRECT_URI:-}
      # Adapter rate limit (token bucket per tenant×provider)
      ADAPTER_RATE_BURST: ${ADAPTER_RATE_BURST:-10}
      ADAPTER_RATE_REFILL_PER_SEC: ${ADAPTER_RATE_REFILL_PER_SEC:-1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      CONVERSATION_SERVICE_URL: ${CONVERSATION_SERVICE_URL:-http://conversation:4002}
      # Must match the receivers' INTERNAL_SERVICE_KEY default below - the AI sends
      # this token and authenticate() accepts either. Empty default desyncs them.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-chatcenter-internal-2026}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-chatcenter-internal-2026}
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-}
    # Debug-only: provides the inspect-deep preload referenced by NODE_OPTIONS.
    # Harmless when NODE_OPTIONS is unset (the file just isn't loaded).
    volumes:
      - ./tools:/app/tools:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # ─── Notifications Service (event-driven engine + WS gateway) ────
  notifications:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${NOTIFICATIONS_PORT:-4008}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      SESSION_COOKIE_ACCEPT: ${SESSION_COOKIE_ACCEPT:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-}
      LEGACY_BEARER_ACCEPT: ${LEGACY_BEARER_ACCEPT:-}
      COOKIE_ONLY_ENFORCE: ${COOKIE_ONLY_ENFORCE:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  billing:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    environment:
      # Official Bank of Israel USD/ILS feed. Off by default: with it off there
      # is no chargeable rate, which is the safe direction.
      BOI_FX_ENABLED: ${BOI_FX_ENABLED:-false}
      # How long a published rate stays usable. The BOI does not publish on
      # weekends or Israeli holidays, so Friday must carry through to Sunday.
      BOI_FX_MAX_STALENESS_HOURS: ${BOI_FX_MAX_STALENESS_HOURS:-120}
      BOI_FX_BASE_URL: ${BOI_FX_BASE_URL:-}
      # Where a customer returns after the hosted payment page. Without it the
      # return URLs are omitted and they land wherever the provider defaults to.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      # Hosts this deployment may send a paying customer back through. Empty
      # disables the check; set it in production so a mistyped APP_PUBLIC_URL
      # cannot hand a payment provider someone else's domain.
      APP_PUBLIC_URL_ALLOWED_HOSTS: ${APP_PUBLIC_URL_ALLOWED_HOSTS:-}
      # Authenticates the GATEWAY -> billing hop for forwarded notifications.
      # Not a provider secret: iCount cannot sign anything, and the IPN endpoint
      # is built so it does not need them to.
      INTERNAL_BILLING_WEBHOOK_FORWARD_SECRET: ${INTERNAL_BILLING_WEBHOOK_FORWARD_SECRET:-}
      # Read here to REPORT enforcement in the Sysadmin preview and the
      # enforcement impact report. Both the mode AND the grace period must match
      # what the other services use, or the report describes a different system
      # than the one refusing customers - which is worse than no report, because
      # someone would act on it.
      BILLING_ENFORCEMENT_MODE: ${BILLING_ENFORCEMENT_MODE:-enforce}
      BILLING_PAST_DUE_GRACE_HOURS: ${BILLING_PAST_DUE_GRACE_HOURS:-72}
      BILLING_ALLOW_UNENFORCED: ${BILLING_ALLOW_UNENFORCED:-}
      # ── Payment capability switches. Separate from ICOUNT_MODE: that decides
      # whether the provider can be reached, these decide whether the capability
      # is part of the product yet. All default OFF, because a payment
      # capability that switches itself on takes someone's money somewhere
      # nobody meant it to. ──
      ICOUNT_CHECKOUT_ENABLED: ${ICOUNT_CHECKOUT_ENABLED:-false}
      ICOUNT_TOKENIZATION_ENABLED: ${ICOUNT_TOKENIZATION_ENABLED:-false}
      ICOUNT_STORED_CARD_CHARGE_ENABLED: ${ICOUNT_STORED_CARD_CHARGE_ENABLED:-false}
      # Whether a customer may open their own checkout. Off: every checkout is
      # opened by a human through Sysadmin paid provisioning.
      SELF_SERVE_CHECKOUT_ENABLED: ${SELF_SERVE_CHECKOUT_ENABLED:-false}
      # ── Shopify Billing. ALL OFF BY DEFAULT: with SHOPIFY_BILLING_ENABLED
      # false the billing source refuses every operation and grants nothing, so
      # a stack that has not been deliberately configured behaves exactly as it
      # does today. Declared here even while unused because an undeclared
      # variable is silently `undefined` - the failure this file's env-wiring
      # test exists to catch. ──
      SHOPIFY_BILLING_ENABLED: ${SHOPIFY_BILLING_ENABLED:-false}
      # "app_pricing" (Shopify hosts plan selection) or "manual" (the GraphQL
      # Billing API). Unset means disabled - there is no default way to charge.
      SHOPIFY_BILLING_MODE: ${SHOPIFY_BILLING_MODE:-}
      # mock (no network, cannot charge) | test (dev stores, Shopify prices at
      # $0) | live. Anything unrecognised degrades to mock.
      SHOPIFY_BILLING_ENV: ${SHOPIFY_BILLING_ENV:-mock}
      # Second, separate acknowledgement before real money can move.
      SHOPIFY_ALLOW_LIVE_BILLING: ${SHOPIFY_ALLOW_LIVE_BILLING:-false}
      # full | connector_addon | grandfathered_only. Unset means the policy
      # resolver answers UNRESOLVED and the merchant lands on a non-charging
      # billing-pending screen, which is the correct answer until Shopify tells
      # us which arrangement is permitted.
      SHOPIFY_BILLING_POLICY_MODE: ${SHOPIFY_BILLING_POLICY_MODE:-}
      # Whether one workspace may be billed by Shopify AND by GOTCHA at once.
      # Stays false until Shopify confirms split billing is allowed: wrong in
      # this direction shows a pending screen, wrong the other way bills a
      # merchant twice for one capability.
      SHOPIFY_ALLOW_SPLIT_BILLING: ${SHOPIFY_ALLOW_SPLIT_BILLING:-false}
      # Whether an existing customer may keep external billing after connecting
      # Shopify. Off: nobody is grandfathered by default or by claim.
      SHOPIFY_ALLOW_GRANDFATHERED: ${SHOPIFY_ALLOW_GRANDFATHERED:-false}
      # Metered usage dispatch to Shopify's App Events API.
      SHOPIFY_USAGE_BILLING_ENABLED: ${SHOPIFY_USAGE_BILLING_ENABLED:-false}
      # App handle used to build Shopify's hosted plan-selection URL. Without it
      # app_pricing refuses to start rather than redirect to a broken admin URL.
      SHOPIFY_APP_HANDLE: ${SHOPIFY_APP_HANDLE:-}
      # Split out of SHOPIFY_APP_HANDLE in App Store review 132211. Shopify uses
      # "handle" for two different identifiers and they are not guaranteed to
      # match:
      #   SHOPIFY_APP_STORE_HANDLE   the App Store LISTING slug, used only in
      #                              https://apps.shopify.com/<slug>
      #   SHOPIFY_APP_PRICING_HANDLE the APP handle, used in admin deep links
      #                              such as /charges/<handle>/pricing_plans
      # Both fall back to SHOPIFY_APP_HANDLE when unset, so this is additive.
      SHOPIFY_APP_STORE_HANDLE: ${SHOPIFY_APP_STORE_HANDLE:-}
      SHOPIFY_APP_PRICING_HANDLE: ${SHOPIFY_APP_PRICING_HANDLE:-}
      SHOPIFY_APP_STORE_SEARCH_TERM: ${SHOPIFY_APP_STORE_SEARCH_TERM:-GOTCHA}
      # Is the App Store listing APPROVED and publicly reachable?
      #
      # OFF until Shopify approves the listing. An unapproved listing 404s for
      # anyone not signed in to a Partner account, and a "Limited visibility"
      # app never appears in App Store search even after approval - so before
      # approval there is nowhere to send a merchant, and the button explains
      # that installation begins on Shopify instead of navigating to a 404.
      #
      # Flip this to "true" on approval day. No rebuild, no code change.
      SHOPIFY_APP_STORE_LISTING_LIVE: ${SHOPIFY_APP_STORE_LISTING_LIVE:-false}
      # Optional. Where to point a merchant while the listing is not public -
      # during App Store review, the install link from the Shopify dashboard.
      # Shown as HELP beside the explanation, never as the install path, and
      # never constructed by us. Unset is fine: the explanation stands alone.
      SHOPIFY_INSTALL_HELP_URL: ${SHOPIFY_INSTALL_HELP_URL:-}
      SHOPIFY_PENDING_INSTALL_TTL_SECONDS: ${SHOPIFY_PENDING_INSTALL_TTL_SECONDS:-}
      # JSON maps. Plan handles and meter handles are CONFIGURATION and live in
      # the Partner Dashboard; prices are never defined in this repo.
      SHOPIFY_BILLING_PLAN_HANDLES: ${SHOPIFY_BILLING_PLAN_HANDLES:-}
      SHOPIFY_USAGE_METER_HANDLES: ${SHOPIFY_USAGE_METER_HANDLES:-}
      # The full plan catalog: keys, Shopify handles, visibility, which
      # entitlements each plan funds, and which stores a private plan is
      # offered to. JSON array. Empty means NO plan is sellable, which is the
      # fail-closed state - a merchant is told billing is not available rather
      # than being charged against a plan nobody defined.
      SHOPIFY_BILLING_PLAN_CATALOG: ${SHOPIFY_BILLING_PLAN_CATALOG:-}
      # The App Store publication moment, ISO 8601. Grandfathering is measured
      # against this: a workspace that started PAYING before it keeps GOTCHA
      # billing. Unset means nobody is automatically eligible - never everybody.
      SHOPIFY_APP_PUBLICATION_CUTOFF: ${SHOPIFY_APP_PUBLICATION_CUTOFF:-}
      # Whether a Shopify development store may be grandfathered automatically.
      # Off by default: a dev store has no commercial history, so a grant there
      # is a testing artefact that would be indistinguishable from a real one.
      SHOPIFY_GRANDFATHER_DEV_STORES: ${SHOPIFY_GRANDFATHER_DEV_STORES:-false}
      # Stores permitted into the Shopify App Pricing flow while
      # SHOPIFY_BILLING_ENV=test. Comma or whitespace separated myshopify
      # handles or domains.
      #
      # `test` is not an isolated environment - it is production with a flag
      # flipped, beside real merchants. Without this, flipping that flag would
      # redirect every connected store to a Shopify pricing page they never
      # asked for. Empty allows NOBODY, which is the safe default, and `live`
      # ignores it entirely.
      SHOPIFY_BILLING_TEST_SHOPS: ${SHOPIFY_BILLING_TEST_SHOPS:-}
      # SECRET. App Pricing sends no subscription webhooks, so the Partner API
      # is the only way to learn that a merchant paid.
      SHOPIFY_PARTNER_API_TOKEN: ${SHOPIFY_PARTNER_API_TOKEN:-}
      # SECRET. client_credentials identity for the App Events usage endpoint.
      SHOPIFY_APP_EVENTS_CLIENT_ID: ${SHOPIFY_APP_EVENTS_CLIENT_ID:-}
      # App Events (usage) and Partner API (verification) credentials. Both are
      # APP-level, not per-shop, which is what lets billing hold them without
      # ever touching a merchant's Admin token - that belongs to services/ai.
      SHOPIFY_APP_EVENTS_CLIENT_SECRET: ${SHOPIFY_APP_EVENTS_CLIENT_SECRET:-}
      SHOPIFY_APP_EVENTS_BASE_URL: ${SHOPIFY_APP_EVENTS_BASE_URL:-}
      # App Pricing sends NO subscription webhooks, so this query is the only
      # way to learn that a merchant paid. All three are required together.
      SHOPIFY_PARTNER_ORGANIZATION_ID: ${SHOPIFY_PARTNER_ORGANIZATION_ID:-}
      SHOPIFY_PARTNER_APP_ID: ${SHOPIFY_PARTNER_APP_ID:-}
      SHOPIFY_PARTNER_API_BASE_URL: ${SHOPIFY_PARTNER_API_BASE_URL:-}
      SHOPIFY_PARTNER_API_VERSION: ${SHOPIFY_PARTNER_API_VERSION:-}
      # For SHOPIFY_BILLING_MODE=manual, billing asks services/ai to perform the
      # Shopify Admin call: that service owns the merchant's access token, and
      # billing must never hold a second copy of it.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:4006}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      # Identifies the build that made a billing policy decision. Same pair
      # Sentry resolves a release from, so a decision and an error report from
      # one deploy name the same build. Without them every audited decision
      # would record codeVersion="unknown", silently.
      SENTRY_RELEASE: ${SENTRY_RELEASE:-${TAG:-}}
      BUILD_SHA: ${BUILD_SHA:-dev}
      # Drops Secure from the checkout continuation cookie, for plaintext local
      # work only. Not inferred from the request: TLS terminates at the edge, so
      # X-Forwarded-Proto reports the internal hop and trusting it would drop
      # Secure on every real request. The safe value is the default.
      CHECKOUT_COOKIE_INSECURE: ${CHECKOUT_COOKIE_INSECURE:-}
      # Required to charge live, alongside NODE_ENV=production. Declared so it
      # can be set through the normal path rather than by editing compose.
      ICOUNT_ALLOW_LIVE: ${ICOUNT_ALLOW_LIVE:-}
      ICOUNT_ALLOW_SIMULATOR: ${ICOUNT_ALLOW_SIMULATOR:-}
      # ICOUNT_MODE=test reaches the REAL iCount API with real credentials, and
      # is the only non-production way to exercise the hosted page. Two things
      # keep it safe and both are required: the acknowledgement, and the account
      # the token must resolve to - checked against auth/info before any write,
      # so a production token in a dev stack is refused rather than charged.
      ICOUNT_ALLOW_TEST: ${ICOUNT_ALLOW_TEST:-}
      ICOUNT_TEST_ACCOUNT_ID: ${ICOUNT_TEST_ACCOUNT_ID:-}
      ICOUNT_ENVIRONMENT: ${ICOUNT_ENVIRONMENT:-}
      ICOUNT_PROVIDER_EVENTS_ENABLED: ${ICOUNT_PROVIDER_EVENTS_ENABLED:-}
      PAYMENT_LINK_TTL_HOURS: ${PAYMENT_LINK_TTL_HOURS:-}
      PAYMENT_LINK_RESEND_COOLDOWN_SECONDS: ${PAYMENT_LINK_RESEND_COOLDOWN_SECONDS:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BILLING_PORT:-4009}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      SESSION_COOKIE_ACCEPT: ${SESSION_COOKIE_ACCEPT:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-}
      LEGACY_BEARER_ACCEPT: ${LEGACY_BEARER_ACCEPT:-}
      COOKIE_ONLY_ENFORCE: ${COOKIE_ONLY_ENFORCE:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-chatcenter-internal-2026}
      # Identity is auth's domain: billing asks it to welcome a paid tenant and
      # hand that admin a way in. Without this the welcome email never sends,
      # and a customer who paid from an emailed link has no way to set a
      # password at all.
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:4001}
      # Billing config
      BILLING_PROVIDER: ${BILLING_PROVIDER:-ICOUNT}
      BILLING_TRIAL_DAYS: ${BILLING_TRIAL_DAYS:-14}
      BILLING_DUNNING_DAYS: ${BILLING_DUNNING_DAYS:-0,3,7}
      BILLING_SCHEDULER_ENABLED: ${BILLING_SCHEDULER_ENABLED:-true}
      BILLING_CYCLE_INTERVAL_MS: ${BILLING_CYCLE_INTERVAL_MS:-3600000}
      # Public marketing catalog. Default FALSE everywhere - provisional prices
      # must never become publicly reachable by omission. nginx enforces the
      # same flag for the page, so the gate holds without JavaScript.
      PUBLIC_PRICING_ENABLED: ${PUBLIC_PRICING_ENABLED:-false}
      PUBLIC_PRICING_CACHE_SECONDS: ${PUBLIC_PRICING_CACHE_SECONDS:-120}
      # iCount. Mock by default. Authentication is API-TOKEN ONLY - there is no
      # username/password path. Billing service only; never NEXT_PUBLIC.
      ICOUNT_MODE: ${ICOUNT_MODE:-mock}
      ICOUNT_API_TOKEN: ${ICOUNT_API_TOKEN:-}
      ICOUNT_API_BASE_URL: ${ICOUNT_API_BASE_URL:-https://api.icount.co.il/api/v3.php}
      # Configuration, not a credential: which "Credit card token" PayPage to use.
      ICOUNT_PAYMENT_PAGE_ID: ${ICOUNT_PAYMENT_PAGE_ID:-}
      ICOUNT_WEBHOOK_SECRET: ${ICOUNT_WEBHOOK_SECRET:-}
      # Dedicated card-token key. Billing service only; never NEXT_PUBLIC.
      BILLING_PAYMENT_TOKEN_ENCRYPTION_KEY: ${BILLING_PAYMENT_TOKEN_ENCRYPTION_KEY:-}
      BILLING_PAYMENT_TOKEN_DECRYPTION_KEYS: ${BILLING_PAYMENT_TOKEN_DECRYPTION_KEYS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  voice-copilot:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/voice-copilot/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${VOICE_COPILOT_PORT:-4007}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:4006}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-chatcenter-internal-2026}
      STT_PROVIDER: ${STT_PROVIDER:-stub}
      STT_STUB_SEED: ${STT_STUB_SEED:-42}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Required for decrypting per-tenant Twilio creds stored in voice_channels
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      PUBLIC_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      SESSION_COOKIE_ACCEPT: ${SESSION_COOKIE_ACCEPT:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-}
      LEGACY_BEARER_ACCEPT: ${LEGACY_BEARER_ACCEPT:-}
      COOKIE_ONLY_ENFORCE: ${COOKIE_ONLY_ENFORCE:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      # Paid-access gate - see the `ai` service for the full note. Present here
      # because this service can produce billable work on its own, and a service
      # without this variable defaults to "off", which is a bypass path.
      BILLING_ENFORCEMENT_MODE: ${BILLING_ENFORCEMENT_MODE:-enforce}
      BILLING_PAST_DUE_GRACE_HOURS: ${BILLING_PAST_DUE_GRACE_HOURS:-72}
      BILLING_ALLOW_UNENFORCED: ${BILLING_ALLOW_UNENFORCED:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${VOICE_COPILOT_PORT:-4007}/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ─── Workers (independently scalable) ────────────────────
  incoming-worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/incoming-worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      # Paid-access gate - see the `ai` service for the full note. Present here
      # because this service can produce billable work on its own, and a service
      # without this variable defaults to "off", which is a bypass path.
      BILLING_ENFORCEMENT_MODE: ${BILLING_ENFORCEMENT_MODE:-enforce}
      BILLING_PAST_DUE_GRACE_HOURS: ${BILLING_PAST_DUE_GRACE_HOURS:-72}
      BILLING_ALLOW_UNENFORCED: ${BILLING_ALLOW_UNENFORCED:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      FACEBOOK_API_URL: ${FACEBOOK_API_URL:-}
      INSTAGRAM_API_URL: ${INSTAGRAM_API_URL:-https://graph.instagram.com}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-chatcenter-internal-2026}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-chatcenter-internal-2026}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:4006}
      CONVERSATION_SERVICE_URL: ${CONVERSATION_SERVICE_URL:-http://conversation:4002}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    deploy:
      replicas: ${INCOMING_WORKER_REPLICAS:-1}

  outgoing-worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: services/outgoing-worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      # Paid-access gate - see the `ai` service for the full note. Present here
      # because this service can produce billable work on its own, and a service
      # without this variable defaults to "off", which is a bypass path.
      BILLING_ENFORCEMENT_MODE: ${BILLING_ENFORCEMENT_MODE:-enforce}
      BILLING_PAST_DUE_GRACE_HOURS: ${BILLING_PAST_DUE_GRACE_HOURS:-72}
      BILLING_ALLOW_UNENFORCED: ${BILLING_ALLOW_UNENFORCED:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-}
      FACEBOOK_API_URL: ${FACEBOOK_API_URL:-}
      INSTAGRAM_API_URL: ${INSTAGRAM_API_URL:-https://graph.instagram.com}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: ${OUTGOING_WORKER_REPLICAS:-1}

  # ─── DB Migration (run manually: docker compose run --rm migrate) ─────
  migrate:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    command: >
      sh -c "cd /app/packages/shared && npx prisma migrate deploy && npx tsx prisma/seed.ts && npx tsx prisma/seed-billing.ts"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      MESSENGER_PAGE_ID: ${MESSENGER_PAGE_ID:-}
      MESSENGER_ACCESS_TOKEN: ${MESSENGER_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles:
      - migrate

  # ─── Frontend (dev: hot reload via `next dev`) ───────────
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    # NEXT_PUBLIC_* are read at runtime by `next dev` (no rebuild needed).
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
      NEXT_PUBLIC_META_APP_ID: ${META_APP_ID:-}
      NEXT_PUBLIC_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ${WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID:-}
      # The browser talks to Authentik directly, so these must be the PUBLIC
      # URL (auth.gotcha.co.il in production), not the internal service DNS.
      NEXT_PUBLIC_OIDC_ISSUER: ${NEXT_PUBLIC_OIDC_ISSUER}
      NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:-gotcha-app}
      NEXT_PUBLIC_OIDC_REDIRECT_URI: ${NEXT_PUBLIC_OIDC_REDIRECT_URI:-}
      # Mirrors the server flag so nav/section render correctly on first paint.
      # This is presentation only - nginx and the billing service are the gate.
      NEXT_PUBLIC_PRICING_ENABLED: ${PUBLIC_PRICING_ENABLED:-false}
      # Footer social profiles. Unset means the icon is not rendered at all.
      NEXT_PUBLIC_SOCIAL_INSTAGRAM_URL: ${SOCIAL_INSTAGRAM_URL:-}
      NEXT_PUBLIC_SOCIAL_FACEBOOK_URL: ${SOCIAL_FACEBOOK_URL:-}
      NEXT_PUBLIC_SOCIAL_WHATSAPP_URL: ${SOCIAL_WHATSAPP_URL:-}
    # Bind-mount source for hot reload; keep container's node_modules/.next.
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # ── The redesigned app, installed BESIDE the existing product ───────────────
  #
  # Its own repository, its own dependencies, its own image. Reachable at /v2
  # once the gateway route exists; until then it is only on the compose network.
  # What is deliberately ABSENT matters as much as what is here:
  #
  #   * no `volumes:` - the legacy service above bind-mounts its source, which
  #     means sharing a host `node_modules`. That is the one thing this
  #     deployment was asked not to do, so this runs a built image and its
  #     behaviour never depends on an editor having saved.
  #   * no published port - the gateway reaches it as `frontend-v2:3000` over
  #     the compose network. A host port would be a collision to negotiate on a
  #     contended box, for no reader.
  #   * no `depends_on` - so `docker compose up -d --no-deps frontend-v2` cannot
  #     recreate a running platform service. Recreation hands a service a new IP
  #     and this gateway resolves its upstreams once, at startup.
  #   * no `${VAR:?...}` anywhere below - a required-variable error makes EVERY
  #     `docker compose` command in this project fail, including `ps` and
  #     `config`, for every other session on this checkout. A missing value is
  #     left to fail in the app, which says exactly which variable it was.
  # ════════════════════════════════════════════════════════════════════════════
  # ★★ THE SIGN-IN SCREEN, ON ITS OWN ORIGIN
  # ════════════════════════════════════════════════════════════════════════════
  # Same source as `frontend-v2`, built with a DIFFERENT base path, so the
  # bundle is mounted at `/` instead of `/v2`. That is not a routing
  # preference: `basePath` is compiled INTO the client bundle, so a page built
  # for `/v2` cannot be proxied onto another host - every asset URL, every
  # router link and both outbound targets carry a mount point that host does
  # not have. A second build is the only honest answer, and it is one argument.
  #
  # ★ WHY A SEPARATE ORIGIN AT ALL. On `dev.gotcha.co.il` the password field
  #   shares an origin with the inbox, analytics, settings and every script the
  #   product loads - measured, the gateway's policy there still permits
  #   `'unsafe-inline'`, `'unsafe-eval'` and `connect.facebook.net`. Here the
  #   origin contains the sign-in screen and nothing else.
  #
  # ⚠ AND THE RISK THAT COMES WITH IT: this image is the WHOLE application, so
  #   it serves every product route. What keeps them off this origin is the
  #   gateway's allowlist, which makes that nginx block a SECURITY CONTROL
  #   rather than routing. See `nginx.conf.template`, the auth-dev server.
  frontend-auth:
    restart: unless-stopped
    build:
      context: ../redesign
      args:
        # Root-mounted. An ARG with an empty value is SET, and an empty base
        # path is exactly what `next.config.ts` normalises to "no prefix".
        NEXT_PUBLIC_BASE_PATH: ""
        # ★ Same-origin here, so no proxy is needed - the dividend of moving.
        #   Used VERBATIM, never through `appPath`: it names the IdP's layout,
        #   and prefixing it with where this app is mounted would be the
        #   base-path defect pointing the other way.
        NEXT_PUBLIC_FLOW_EXECUTOR_BASE: /api/v3
        NEXT_PUBLIC_APP_ENV: ${V2_APP_ENV:-local}
        NEXT_PUBLIC_REALTIME_URL: ${V2_REALTIME_URL:-https://dev.gotcha.co.il}
    environment:
      APP_ENV: ${V2_APP_ENV:-local}
      API_BASE_URL: ${V2_API_BASE_URL:-https://dev.gotcha.co.il}
      # ★★ THE WHOLE URL, GIVEN RATHER THAN COMPOSED.
      #
      # An origin alone is not enough: composing the target needs the PRODUCT's
      # base path, and this build only has its own, which is empty. That is
      # `new URL('/a', 'https://host/v2')` one container removed - an absolute
      # path discarding a base that belongs to somebody else.
      PRODUCT_LOGIN_URL: ${AUTH_PRODUCT_LOGIN_URL:-https://dev.gotcha.co.il/v2/api/auth/login}
      # This app is served from the auth host, so its own origin is that one.
      APP_ORIGIN: ${AUTH_APP_ORIGIN:-https://auth-dev.gotcha.co.il}
      OIDC_ISSUER: ${NEXT_PUBLIC_OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${V2_OIDC_CLIENT_ID:-${NEXT_PUBLIC_OIDC_CLIENT_ID:-gotcha-app}}
      SESSION_SECRET: ${V2_SESSION_SECRET:-}

  frontend-v2:
    restart: unless-stopped
    build:
      context: ../redesign
      args:
        # ★ A BUILD ARG, NOT AN `environment:` ENTRY.
        #
        # `basePath` is inlined into the client bundle by `next build`. Supplied
        # only at runtime it does nothing and warns about nothing: the server
        # routes under the prefix while the browser's own JavaScript fetches the
        # root. The Dockerfile re-declares it in the runtime stage from this same
        # arg so the two halves cannot drift apart.
        NEXT_PUBLIC_BASE_PATH: /v2
        # Every NEXT_PUBLIC_* the source reads is inlined by `next build`, so
        # each one that matters has to be here. The Dockerfile repeats only
        # BASE_PATH and REALTIME_URL in the runtime stage, and that asymmetry is
        # deliberate: `next.config.ts` re-reads the first on `next start` and
        # `proxy.ts` re-reads the second per request for the CSP. The others are
        # consumed by the bundle, where they are already baked.
        NEXT_PUBLIC_REALTIME_URL: ${V2_REALTIME_URL:-https://dev.gotcha.co.il}
        # ★ MUST BE PASSED, AND AN EMPTY VALUE IS NOT THE SAME AS NO VALUE.
        #
        # The schema is `z.enum([...]).default('local')`, and a zod default
        # applies to `undefined` only. The Dockerfile declares
        # `ARG NEXT_PUBLIC_APP_ENV=""`, and a Docker ARG WITH a default is SET -
        # measured, not assumed:
        #
        #   ARG WITH_DEFAULT=""   -> set=yes, value []
        #   ARG NO_DEFAULT        -> set=no
        #
        # So leaving this out hands the client schema an empty string instead of
        # nothing, the enum rejects it, and `clientEnv` throws at module load in
        # the BROWSER - a blank app served by a healthy-looking container.
        NEXT_PUBLIC_APP_ENV: ${V2_APP_ENV:-local}
    environment:
      # ════════════════════════════════════════════════════════════════════════
      # ★★ WHERE THE SIGN-IN SCREEN LIVES. UNSET = TODAY'S BEHAVIOUR.
      # ════════════════════════════════════════════════════════════════════════
      # Set this and an unauthenticated visitor is sent to our panel on its own
      # origin instead of to `/v2/sign-in` here. Unset it and one restart puts
      # the product back exactly as it was - a better rollback than a revert,
      # which is why this is a value rather than a code change.
      #
      # ★ NOT `PLATFORM_LOGIN_URL`, and the distinction is load-bearing. That
      #   one means "do not use our panel at all"; this means "our panel, on
      #   another host" - opposite facts. Borrowing one for both would land
      #   somebody on the legacy product's login, which LOOKS like a working
      #   sign-in. `PLATFORM_LOGIN_URL` still wins above this.
      #
      # ★ UNPREFIXED AND UNLOCALISED ON PURPOSE. The auth origin answers
      #   `307 -> /en/sign-in` from the browser's own `Accept-Language`.
      #   Naming a locale here would override somebody's preference on the
      #   first page they ever see, and nothing in the app would object -
      #   that is a property of THIS VALUE, not of the code that reads it.
      #
      # Commented until the walk confirms `returnTo` survives two origin hops.
      SIGN_IN_URL: ${V2_SIGN_IN_URL:-https://auth-dev.gotcha.co.il/sign-in}
      APP_ENV: ${V2_APP_ENV:-local}
      # Server-to-server only, and never sent to the browser: every browser call
      # goes through this app's own BFF, because the platform API allows only
      # its own origin through CORS.
      API_BASE_URL: ${V2_API_BASE_URL:-https://dev.gotcha.co.il}
      # The browser talks to Authentik directly, so this is the PUBLIC issuer,
      # not internal service DNS. Defaulted from the platform's own value so
      # there is one place to change it.
      OIDC_ISSUER: ${NEXT_PUBLIC_OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${V2_OIDC_CLIENT_ID:-${NEXT_PUBLIC_OIDC_CLIENT_ID:-gotcha-app}}
      # ★ OIDC_CLIENT_SECRET IS ABSENT, NOT EMPTY, AND THE DIFFERENCE IS A 500.
      #
      # Its schema is `z.string().min(1).optional()`. Optional permits the
      # variable to be MISSING; it does not permit an empty string. Declaring it
      # here as `${V2_OIDC_CLIENT_SECRET:-}` supplied "" and every request that
      # read the server config failed validation - the sign-in page still
      # rendered, because it does not read it, so the app looked healthy and only
      # the login route 500'd.
      #
      # This client is public and uses PKCE, so there is no secret to carry. A
      # confidential client adds the line back WITH a value; it must never be
      # present and empty.
      # Reduced to its origin by `appUrl`, which then rebuilds the path from the
      # base path - so whether this carries /v2 makes no difference to the
      # redirect_uri. It is written as a bare origin because that is what the
      # schema calls it.
      APP_ORIGIN: ${V2_APP_ORIGIN:-https://dev.gotcha.co.il}
      # NEXT_PUBLIC_REALTIME_URL is deliberately NOT here. The runtime stage
      # declares it as ARG+ENV from the same build arg above, so the image
      # already carries it and the bundle and the CSP cannot disagree. Setting it
      # here as well would let somebody change the CSP's origin at runtime while
      # the bundle kept connecting to the baked one.
      # 32+ bytes. Deliberately left empty: this is the one value that is
      # identity material, it is nobody's to mint on another team's behalf, and
      # an empty default fails at the first request naming this variable rather
      # than booting a container with a guessable cookie key.
      SESSION_SECRET: ${V2_SESSION_SECRET:-}

volumes:
  redis_data:
  pgdata:
  qdrant_data:
  uploads:
  authentik_pgdata:
  authentik_media:
  authentik_templates:

# Lower MTU to 1442 to match this host's path MTU (~1492, PPPoE-style link).
# Without this, container bulk transfers (external HTTPS to OpenAI/CRMs) stall
# because NATed connections never receive the ICMP "fragmentation needed"
# feedback for PMTU discovery. See daemon.json mtu for the build-time fix.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1442"
