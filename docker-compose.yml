services:
  # ─── Infrastructure ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_cc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Authentik (identity provider) ───────────────────────
  # Authentik owns ALL authentication: credentials, sessions, MFA, recovery,
  # email verification. It gets its OWN database - GOTCHA business data and
  # identity data must never share a schema. GOTCHA never writes to it except
  # via the admin API (invitations).
  authentik-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${AUTHENTIK_PG_USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS:-authentik}
      POSTGRES_DB: ${AUTHENTIK_PG_DB:-authentik}
    volumes:
      - authentik_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTHENTIK_PG_USER:-authentik}"]
      interval: 5s
      timeout: 5s
      retries: 10

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.10
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-dev-only-authentik-secret-key-change-in-production}
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB:-authentik}
      # Shared redis, dedicated logical DB so Authentik keys never collide
      # with BullMQ queues on db 0.
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__DB: 1
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@gotcha.co.il}
      AUTHENTIK_EMAIL__HOST: ${SMTP_HOST:-}
      AUTHENTIK_EMAIL__PORT: ${SMTP_PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${SMTP_USER:-}
      AUTHENTIK_EMAIL__PASSWORD: ${SMTP_PASS:-}
      # STARTTLS is mandatory for Gmail on 587 - without it the server never
      # advertises AUTH and every send fails with SMTPNotSupportedError.
      AUTHENTIK_EMAIL__USE_TLS: ${SMTP_USE_TLS:-true}
      AUTHENTIK_EMAIL__FROM: ${SMTP_FROM:-noreply@gotcha.co.il}
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      # GOTCHA-branded recovery email (referenced by the email stage's template
      # field, set in scripts/authentik/bootstrap.mjs).
      - ./scripts/authentik/templates/gotcha_password_reset.html:/templates/gotcha_password_reset.html:ro
      # GOTCHA theme: served at /static/dist/..., injected into the flow UI's
      # shadow roots via the data-inject stylesheet hook.
      - ./scripts/authentik/custom.css:/web/dist/custom.css:ro
      - ./frontend/public/logo_icon.png:/web/dist/assets/custom/logo_icon.png:ro
      # GOTCHA favicon for the Authentik browser tab (served at
      # /static/dist/assets/custom/gotcha-favicon.ico). Referenced by the brand's
      # branding_favicon, set in scripts/authentik/bootstrap.mjs.
      - ./frontend/public/favicon.ico:/web/dist/assets/custom/gotcha-favicon.ico:ro
      - ./frontend/public/full_icon_white.png:/web/dist/assets/custom/full_icon_white.png:ro
      - ./frontend/public/authentik-enhance.js:/web/dist/assets/custom/authentik-enhance.js:ro
    ports:
      - "${AUTHENTIK_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    depends_on:
      authentik-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.10
    command: worker
    environment: *authentik-env
    user: root
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      # The worker is the process that actually renders + sends stage emails.
      - ./scripts/authentik/templates/gotcha_password_reset.html:/templates/gotcha_password_reset.html:ro
      # NOTE: the host Docker socket is intentionally NOT mounted. Authentik's
      # worker does not need it for our deployment, and exposing the socket to a
      # root container is a container-escape path (M-7). Prod never mounted it.
    depends_on:
      authentik-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── API Gateway ─────────────────────────────────────────
  gateway:
    image: nginx:alpine
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
    environment:
      AUTH_PORT: ${AUTH_PORT:-4001}
      CONVERSATION_PORT: ${CONVERSATION_PORT:-4002}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-4003}
      ANALYTICS_PORT: ${ANALYTICS_PORT:-4004}
      CHATBOT_PORT: ${CHATBOT_PORT:-4005}
      AI_PORT: ${AI_PORT:-4006}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      VOICE_COPILOT_PORT: ${VOICE_COPILOT_PORT:-4007}
      NOTIFICATIONS_PORT: ${NOTIFICATIONS_PORT:-4008}
      BILLING_PORT: ${BILLING_PORT:-4009}
      # envsubst uses an allowlist - a var missing from the list below stays a
      # literal in the rendered config and nginx refuses to start.
      AUTHENTIK_PORT: ${AUTHENTIK_PORT:-9000}
    command: >
      sh -c "envsubst '$$AUTH_PORT $$CONVERSATION_PORT $$WEBHOOK_PORT $$ANALYTICS_PORT $$CHATBOT_PORT $$AI_PORT $$FRONTEND_PORT $$VOICE_COPILOT_PORT $$NOTIFICATIONS_PORT $$BILLING_PORT $$AUTHENTIK_PORT'
      < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    depends_on:
      - auth
      - conversation
      - webhook
      - analytics
      - chatbot
      - ai
      - frontend
      - voice-copilot
      - notifications
      # nginx resolves every upstream at startup, so the authentik-server name
      # must exist or the gateway dies with "host not found in upstream".
      - authentik-server

  # ─── Microservices ───────────────────────────────────────
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${AUTH_PORT:-4001}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      # Admin API access for provisioning invited identities. ONLY the auth
      # service gets this token - no other service may create identities.
      AUTHENTIK_URL: ${AUTHENTIK_URL:-http://authentik-server:9000}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:-${AUTHENTIK_BOOTSTRAP_TOKEN:-}}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ${WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_OAUTH_REDIRECT_URI: ${INSTAGRAM_OAUTH_REDIRECT_URI:-}
      FACEBOOK_API_URL: ${FACEBOOK_API_URL:-https://graph.facebook.com/v21.0}
      INSTAGRAM_API_URL: ${INSTAGRAM_API_URL:-https://graph.instagram.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      INTEGRATION_REQUEST_EMAIL: ${INTEGRATION_REQUEST_EMAIL:-}
      SYSTEM_ADMIN_SETUP_SECRET: ${SYSTEM_ADMIN_SETUP_SECRET:-change-me-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ONBOARDING_CHAT_MODEL: ${ONBOARDING_CHAT_MODEL:-gpt-4o-mini}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_REDIRECT_URI: ${MICROSOFT_OAUTH_REDIRECT_URI:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_OAUTH_REDIRECT_URI: ${SLACK_OAUTH_REDIRECT_URI:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  conversation:
    build:
      context: .
      dockerfile: services/conversation/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-dev}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${CONVERSATION_PORT:-4002}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://graph.facebook.com/v19.0}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-}
      PUBLIC_URL: ${NEXT_PUBLIC_API_URL:-}
      # Public HTTPS base for outbound Twilio webhook URLs (used by /api/voice-channels)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-chatcenter-internal-2026}
      # Billing provisioning on onboarding completion (entity + trial + Units).
      BILLING_SERVICE_URL: ${BILLING_SERVICE_URL:-http://billing:4009}
      BILLING_DEFAULT_TRIAL_PLAN: ${BILLING_DEFAULT_TRIAL_PLAN:-pro}
      # Required for the Meta Resumable Upload API path that mints media
      # handles for IMAGE/VIDEO/DOCUMENT WhatsApp template examples.
      META_APP_ID: ${META_APP_ID:-}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  webhook:
    build:
      context: .
      dockerfile: services/webhook/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${WEBHOOK_PORT:-4003}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://graph.facebook.com/v19.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
      GMAIL_PUBSUB_TOKEN: ${GMAIL_PUBSUB_TOKEN:-}
      OUTLOOK_WEBHOOK_CLIENT_STATE: ${OUTLOOK_WEBHOOK_CLIENT_STATE:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${ANALYTICS_PORT:-4004}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  chatbot:
    build:
      context: .
      dockerfile: services/chatbot/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${CHATBOT_PORT:-4005}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-dev}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${AI_PORT:-4006}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-gpt-5-mini}
      # ── AI-Unit billing gate: off|observe|soft|hard. Default HARD: credits are
      # enforced for every subscription with enforcementEnabled (POCs, trials,
      # paid). Tenants with NO subscription still fail open (dev tenants keep
      # working); grandfathered subs skip the gate by design. ──
      BILLING_ENFORCEMENT_MODE: ${BILLING_ENFORCEMENT_MODE:-hard}
      BILLING_SERVICE_URL: ${BILLING_SERVICE_URL:-http://billing:4009}
      # Set OPENAI_LOG=debug to log the FULL outbound OpenAI request (system
      # prompt + messages + tool schemas) and response to stdout. Off by default.
      OPENAI_LOG: ${OPENAI_LOG:-}
      # Debug-only: with NODE_OPTIONS set, the inspect-deep preload stops Node
      # from truncating the OPENAI_LOG output to [Array]/[Object]. Off by default.
      NODE_OPTIONS: ${AI_NODE_OPTIONS:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
      CONFLUENCE_CLIENT_ID: ${CONFLUENCE_CLIENT_ID:-}
      CONFLUENCE_CLIENT_SECRET: ${CONFLUENCE_CLIENT_SECRET:-}
      CONFLUENCE_REDIRECT_URI: ${CONFLUENCE_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-}
      CALENDLY_CLIENT_ID: ${CALENDLY_CLIENT_ID:-}
      CALENDLY_CLIENT_SECRET: ${CALENDLY_CLIENT_SECRET:-}
      CALENDLY_REDIRECT_URI: ${CALENDLY_REDIRECT_URI:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      ZOHO_REDIRECT_URI: ${ZOHO_REDIRECT_URI:-}
      ZOHO_ACCOUNTS_URL: ${ZOHO_ACCOUNTS_URL:-https://accounts.zoho.com}
      # ── Marketplace OAuth providers (read by services/ai/src/routes/connectors-admin.ts) ──
      STRIPE_CLIENT_ID: ${STRIPE_CLIENT_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_REDIRECT_URI: ${STRIPE_REDIRECT_URI:-}
      HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
      HUBSPOT_REDIRECT_URI: ${HUBSPOT_REDIRECT_URI:-}
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:-}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:-}
      SHOPIFY_REDIRECT_URI: ${SHOPIFY_REDIRECT_URI:-}
      WIX_CLIENT_ID: ${WIX_CLIENT_ID:-}
      WIX_CLIENT_SECRET: ${WIX_CLIENT_SECRET:-}
      WIX_REDIRECT_URI: ${WIX_REDIRECT_URI:-}
      SQUARE_APPLICATION_ID: ${SQUARE_APPLICATION_ID:-}
      SQUARE_APPLICATION_SECRET: ${SQUARE_APPLICATION_SECRET:-}
      SQUARE_REDIRECT_URI: ${SQUARE_REDIRECT_URI:-}
      SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-}
      SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-}
      SALESFORCE_REDIRECT_URI: ${SALESFORCE_REDIRECT_URI:-}
      MONDAY_CLIENT_ID: ${MONDAY_CLIENT_ID:-}
      MONDAY_CLIENT_SECRET: ${MONDAY_CLIENT_SECRET:-}
      MONDAY_REDIRECT_URI: ${MONDAY_REDIRECT_URI:-}
      # Adapter rate limit (token bucket per tenant×provider)
      ADAPTER_RATE_BURST: ${ADAPTER_RATE_BURST:-10}
      ADAPTER_RATE_REFILL_PER_SEC: ${ADAPTER_RATE_REFILL_PER_SEC:-1}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      CONVERSATION_SERVICE_URL: ${CONVERSATION_SERVICE_URL:-http://conversation:4002}
      # Must match the receivers' INTERNAL_SERVICE_KEY default below - the AI sends
      # this token and authenticate() accepts either. Empty default desyncs them.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-chatcenter-internal-2026}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-chatcenter-internal-2026}
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-}
    # Debug-only: provides the inspect-deep preload referenced by NODE_OPTIONS.
    # Harmless when NODE_OPTIONS is unset (the file just isn't loaded).
    volumes:
      - ./tools:/app/tools:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # ─── Notifications Service (event-driven engine + WS gateway) ────
  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${NOTIFICATIONS_PORT:-4008}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BILLING_PORT:-4009}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-chatcenter-internal-2026}
      # Billing config
      BILLING_PROVIDER: ${BILLING_PROVIDER:-ICOUNT}
      BILLING_TRIAL_DAYS: ${BILLING_TRIAL_DAYS:-14}
      BILLING_DUNNING_DAYS: ${BILLING_DUNNING_DAYS:-0,3,7}
      BILLING_SCHEDULER_ENABLED: ${BILLING_SCHEDULER_ENABLED:-true}
      BILLING_CYCLE_INTERVAL_MS: ${BILLING_CYCLE_INTERVAL_MS:-3600000}
      # iCount (mock by default; set ICOUNT_MODE=live + creds for production)
      ICOUNT_MODE: ${ICOUNT_MODE:-mock}
      ICOUNT_API_BASE: ${ICOUNT_API_BASE:-https://api.icount.co.il/api/v3.php}
      ICOUNT_CID: ${ICOUNT_CID:-}
      ICOUNT_USER: ${ICOUNT_USER:-}
      ICOUNT_PASS: ${ICOUNT_PASS:-}
      ICOUNT_WEBHOOK_SECRET: ${ICOUNT_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  voice-copilot:
    build:
      context: .
      dockerfile: services/voice-copilot/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${VOICE_COPILOT_PORT:-4007}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:4006}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-chatcenter-internal-2026}
      STT_PROVIDER: ${STT_PROVIDER:-stub}
      STT_STUB_SEED: ${STT_STUB_SEED:-42}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Required for decrypting per-tenant Twilio creds stored in voice_channels
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      PUBLIC_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${VOICE_COPILOT_PORT:-4007}/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ─── Workers (independently scalable) ────────────────────
  incoming-worker:
    build:
      context: .
      dockerfile: services/incoming-worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://graph.facebook.com/v19.0}
      FACEBOOK_API_URL: ${FACEBOOK_API_URL:-https://graph.facebook.com/v21.0}
      INSTAGRAM_API_URL: ${INSTAGRAM_API_URL:-https://graph.instagram.com}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-chatcenter-internal-2026}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-chatcenter-internal-2026}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:4006}
      CONVERSATION_SERVICE_URL: ${CONVERSATION_SERVICE_URL:-http://conversation:4002}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC:-}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    deploy:
      replicas: ${INCOMING_WORKER_REPLICAS:-1}

  outgoing-worker:
    build:
      context: .
      dockerfile: services/outgoing-worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: ${NODE_ENV:-development}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://graph.facebook.com/v19.0}
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-}
      FACEBOOK_API_URL: ${FACEBOOK_API_URL:-https://graph.facebook.com/v21.0}
      INSTAGRAM_API_URL: ${INSTAGRAM_API_URL:-https://graph.instagram.com}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: ${OUTGOING_WORKER_REPLICAS:-1}

  # ─── DB Migration (run manually: docker compose run --rm migrate) ─────
  migrate:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    command: >
      sh -c "cd /app/packages/shared && npx prisma migrate deploy && npx tsx prisma/seed.ts && npx tsx prisma/seed-billing.ts"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/whatsapp_cc}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      MESSENGER_PAGE_ID: ${MESSENGER_PAGE_ID:-}
      MESSENGER_ACCESS_TOKEN: ${MESSENGER_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    profiles:
      - migrate

  # ─── Frontend (dev: hot reload via `next dev`) ───────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    # NEXT_PUBLIC_* are read at runtime by `next dev` (no rebuild needed).
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
      NEXT_PUBLIC_META_APP_ID: ${META_APP_ID:-}
      NEXT_PUBLIC_WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID: ${WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID:-}
      # The browser talks to Authentik directly, so these must be the PUBLIC
      # URL (auth.gotcha.co.il in production), not the internal service DNS.
      NEXT_PUBLIC_OIDC_ISSUER: ${NEXT_PUBLIC_OIDC_ISSUER}
      NEXT_PUBLIC_OIDC_CLIENT_ID: ${NEXT_PUBLIC_OIDC_CLIENT_ID:-gotcha-app}
      NEXT_PUBLIC_OIDC_REDIRECT_URI: ${NEXT_PUBLIC_OIDC_REDIRECT_URI:-}
    # Bind-mount source for hot reload; keep container's node_modules/.next.
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  qdrant_data:
  uploads:
  authentik_pgdata:
  authentik_media:
  authentik_templates:

# Lower MTU to 1442 to match this host's path MTU (~1492, PPPoE-style link).
# Without this, container bulk transfers (external HTTPS to OpenAI/CRMs) stall
# because NATed connections never receive the ICMP "fragmentation needed"
# feedback for PMTU discovery. See daemon.json mtu for the build-time fix.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1442"
